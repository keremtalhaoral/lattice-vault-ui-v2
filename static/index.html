<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="page">
    <header class="header">
      <h1 class="title">Vault</h1>
      <div class="controls">
        <label class="field">
          <span class="label">Ara</span>
          <input id="q" type="search" placeholder="Ara…" autocomplete="off" spellcheck="false">
        </label>
        <label class="field">
          <span class="label">Durum</span>
          <select id="status">
            <option value="">tümü</option>
            <option value="proposed">proposed</option>
            <option value="active">active</option>
            <option value="rejected">rejected</option>
            <option value="reverted">reverted</option>
          </select>
        </label>
        <label class="field">
          <span class="label">Güven</span>
          <select id="trust">
            <option value="">tümü</option>
            <option value="verified">verified</option>
            <option value="agent">agent</option>
            <option value="unverified">unverified</option>
          </select>
        </label>
        <button type="button" id="go" class="btn">Ara</button>
        <button type="button" id="clear" class="btn btn-ghost">Temizle</button>
      </div>
    </header>

    <p class="note">Onay yalnızca CLI ile (adım 2).</p>
    <p id="info" class="meta" aria-live="polite"></p>

    <div id="list" class="list" role="list"></div>
    <p id="empty" class="empty" hidden>Kayıt yok.</p>

    <nav class="pager">
      <button type="button" id="prev" class="btn" disabled>Önceki</button>
      <button type="button" id="next" class="btn" disabled>Sonraki</button>
    </nav>
  </div>
  <script src="/app.js"></script>
</body>
</html>
